# Desarrollo: solo PostgreSQL. El backend y el frontend se ejecutan localmente (ver README).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: control_pro
      POSTGRES_PASSWORD: control_pro_dev
      POSTGRES_DB: control_pro
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./deploy/crear-bd-pruebas.sql:/docker-entrypoint-initdb.d/01-pruebas.sql:ro]
volumes:
  pgdata:
