# Conexiones persistentes con el backend: no se abre una conexión TCP nueva por cada petición.
upstream backend_api {
  server backend:5000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 6m;
  # No revelar la versión de nginx en encabezados ni páginas de error.
  server_tokens off;

  # Compresión: el JavaScript y las respuestas JSON viajan ~70 % más ligeros (se nota mucho en celular y en el túnel).
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json text/plain;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  location /api/ {
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  # App instalable: el service worker y el manifiesto siempre se revalidan para que las actualizaciones lleguen al instante.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location / { try_files $uri /index.html; }
}
